<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面跳转中...</title>
    <style>
        /* 完全空白样式，只在极少数情况下显示后备内容 */
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        /* 当跳转失败或脚本未执行时，显示极简提示 (通常用户看不到) */
        .fallback-message {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .fallback-message a {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 500;
        }
    </style>
    <script>
        // ==============================================
        // 配置：在此处修改需要跳转的目标网址
        // ==============================================
        const REDIRECT_TARGET_URL = "https://chat.whatsapp.com/BhbQXkLD5B34C1fnr5wen7";
        
        // 可选：设置跳转延迟（毫秒），0 表示立即跳转，建议保持0或极小值
        const REDIRECT_DELAY_MS = 0;
        
        // ==============================================
        // 执行自动跳转
        // ==============================================
        (function() {
            // 防止在某些环境下重复执行
            if (window.__redirectExecuted) return;
            window.__redirectExecuted = true;
            
            // 验证目标URL是否有效（简单检查）
            function isValidUrl(url) {
                try {
                    const parsed = new URL(url);
                    return parsed.protocol === 'http:' || parsed.protocol === 'https:';
                } catch (e) {
                    return false;
                }
            }
            
            const target = REDIRECT_TARGET_URL;
            
            if (!isValidUrl(target)) {
                console.error('跳转目标URL无效:', target);
                // 显示错误信息在body中
                document.body.innerHTML = '<div class="fallback-message">⚠️ 跳转配置错误，目标URL无效</div>';
                document.body.style.opacity = '1';
                return;
            }
            
            // 执行跳转函数
            function doRedirect() {
                // 使用 replace 进行跳转，这样不会在浏览器历史记录中留下当前空白页
                // 用户点击后退不会回到这个中间页
                window.location.replace(target);
            }
            
            // 根据延迟执行跳转
            if (REDIRECT_DELAY_MS > 0) {
                setTimeout(doRedirect, REDIRECT_DELAY_MS);
            } else {
                // 立即跳转：尝试在DOM解析早期就执行
                if (document.readyState === 'loading') {
                    // 文档还在加载中，使用DOMContentLoaded或直接尝试
                    document.addEventListener('DOMContentLoaded', function() {
                        doRedirect();
                    });
                    // 同时也设置一个极短的超时作为后备，防止事件未触发
                    setTimeout(doRedirect, 50);
                } else {
                    // 文档已经加载完成（例如脚本在底部），直接跳转
                    doRedirect();
                }
            }
            
            // 极端情况：如果5秒后仍未跳转（可能脚本被阻止），显示手动链接
            setTimeout(function() {
                // 检查是否已经跳转（如果页面还在，说明跳转未成功）
                if (document.body && document.body.style.opacity === '0') {
                    document.body.style.opacity = '1';
                    document.body.innerHTML = '<div class="fallback-message">⏳ 页面未自动跳转，请<a href="' + 
                        target.replace(/"/g, '&quot;') + '">点击此处手动前往</a></div>';
                }
            }, 5000);
        })();
    </script>
</head>
<body>
    <!-- 后备内容：极少数情况下（如脚本禁用）显示 -->
    <noscript>
        <div class="fallback-message" style="opacity:1;">
            🔗 请手动访问：<a href="https://chat.whatsapp.com/BhbQXkLD5B34C1fnr5wen7">目标页面</a>
        </div>
    </noscript>
</body>
</html>
