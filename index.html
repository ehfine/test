<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面跳转中...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .fallback-message {
            color: #6b7280;
            font-size: 15px;
            text-align: center;
            padding: 20px;
            line-height: 1.6;
        }
        
        .fallback-message a {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 500;
        }
    </style>
    
    <!-- Facebook Pixel -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        
        fbq('init', '1718689652589257');
        fbq('track', 'PageView');
    </script>

    <script>
        // ==============================================
        // 配置区
        // ==============================================
        const REDIRECT_TARGET_URL = "https://chat.whatsapp.com/KIy2jflyjGP6JvjZyg302Y?s=cl&p=i&mlu=0&amv=2";
        const REDIRECT_DELAY_MS = 0;   // 建议保持 0，立即跳转

        // ==============================================
        // 执行跳转
        // ==============================================
        (function() {
            if (window.__redirectExecuted) return;
            window.__redirectExecuted = true;

            function isValidUrl(url) {
                try {
                    const parsed = new URL(url);
                    return parsed.protocol === 'http:' || parsed.protocol === 'https:';
                } catch (e) {
                    return false;
                }
            }

            const target = REDIRECT_TARGET_URL;

            if (!isValidUrl(target)) {
                console.error('跳转目标URL无效:', target);
                document.body.innerHTML = '<div class="fallback-message">⚠️ 跳转配置错误，目标URL无效</div>';
                document.body.style.opacity = '1';
                return;
            }

            function doRedirect() {
                // 推荐使用 Contact 或 Lead 事件
                fbq('track', 'Contact');        // 最适合跳转到 WhatsApp
                // fbq('track', 'Lead');        // 或者使用 Lead
                // fbq('trackCustom', 'WhatsAppRedirect'); // 自定义事件也可

                window.location.replace(target);
            }

            // 执行跳转
            if (REDIRECT_DELAY_MS > 0) {
                setTimeout(doRedirect, REDIRECT_DELAY_MS);
            } else {
                // 立即跳转 + 兜底
                doRedirect();
                setTimeout(doRedirect, 80);   // 极短延迟兜底
            }

            // 极端情况后备（5秒后仍未跳转）
            setTimeout(function() {
                if (document.body && document.body.style.opacity === '0') {
                    document.body.style.opacity = '1';
                    document.body.innerHTML = `
                        <div class="fallback-message">
                            ⏳ 页面未自动跳转<br>
                            请<a href="${target.replace(/"/g, '&quot;')}">点击此处手动进入</a>
                        </div>`;
                }
            }, 5000);
        })();
    </script>

    <!-- Noscript Pixel -->
    <noscript>
        <img height="1" width="1" style="display:none"
             src="https://www.facebook.com/tr?id=1718689652589257&ev=PageView&noscript=1"/>
    </noscript>
</head>
<body>
    <!-- 无脚本情况下的后备内容 -->
    <noscript>
        <div class="fallback-message" style="opacity:1;">
            🔗 请手动访问：<br>
            <a href="https://chat.whatsapp.com/KIy2jflyjGP6JvjZyg302Y?s=cl&p=i&mlu=0&amv=2" target="_blank" rel="noopener">
                加入 WhatsApp 群组
            </a>
        </div>
    </noscript>
</body>
</html>
